<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Axyztem | Sustainable Business Innovation</title>
<meta name="description" content="Get in touch with Axyztem for SaaS solutions and project inquiries.">
<meta name="robots" content="index, follow">

<link rel="stylesheet" href="css/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<!-- Google reCAPTCHA -->
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>

<body>

<header>
<div class="container">
<nav>
<div class="logo">
<img src="images/axyztem-logo.png" style="height:50px;">
</div>
<div>
<a href="index.html">Home</a>
<a href="about.html">About</a>
<a href="projects.html">Projects</a>
</div>
</nav>
</div>
</header>

<section class="container">
<h2>Get in Touch</h2>

<form id="contactForm">
  <label for="name">Name</label>
  <input type="text" id="name" name="name" required style="width:100%; padding:10px; margin-bottom:15px;">

  <label for="email">Email</label>
  <input type="email" id="email" name="email" required style="width:100%; padding:10px; margin-bottom:15px;">

  <label for="message">Message</label>
  <textarea id="message" name="message" rows="6" required style="width:100%; padding:10px; margin-bottom:15px;"></textarea>

  <!-- Invisible Bot Trap -->
  <div style="display:none;">
    <label>Leave this empty</label>
    <input type="text" name="company">
  </div>

  <!-- reCAPTCHA -->
  <div class="g-recaptcha" data-sitekey="6Lfje6ksAAAAAOugp3R9DYBhBkrUJjKx2nFVOQUM"></div>

  <br>
  <button type="submit" class="btn">Send Message</button>
  <p id="status"></p>
</form>

</section>

<footer>
<p>© Axyztem — Sustainable Business Innovation</p>
</footer>

<script>
document.getElementById('contactForm').addEventListener('submit', async function(e){
  e.preventDefault();

  const formData = new FormData(this);

  // 🪤 Honeypot trap
  if(formData.get("company")){
    document.getElementById('status').textContent = "Spam detected.";
    return;
  }

  // 🧩 Check reCAPTCHA
  const captcha = grecaptcha.getResponse();
  if(!captcha){
    document.getElementById('status').textContent = "Please verify you are human.";
    return;
  }

  formData.append("captcha", captcha);

  // Send data to Worker
  const res = await fetch('/send-email', {
    method: 'POST',
    body: JSON.stringify(Object.fromEntries(formData)),
    headers: { 'Content-Type': 'application/json' }
  });

  if(res.ok){
    document.getElementById('status').textContent = "Message sent! Check your email.";
    this.reset();
    grecaptcha.reset();
  } else {
    document.getElementById('status').textContent = "Error sending message. Try again.";
  }
});
</script>

</body>
</html>
